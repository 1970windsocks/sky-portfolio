  main {
    width: 100%;
    max-width: 460px;
  }
  @media (min-width: 860px) {
    body {
      justify-content: flex-end;
      padding-right: 7%;
    }
  }
  @media (max-width: 480px) {
    body {
      padding: 20px 12px;
      background-attachment: scroll;
    }
    h1 {
      font-size: 1.35rem;
    }
    .card {
      padding: 14px 14px;
    }
  }
  h1 {
    text-align: center;
    font-size: 1.6rem;
    font-weight: 500;
    margin: 4px 0 2px;
    letter-spacing: 0.15em;
    color: #2c2717;
  }
  .subtitle {
    text-align: center;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: #9c8b57;
    margin-bottom: 18px;
  }
  .status {
    text-align: center;
    font-size: 0.75rem;
    color: #a13d3d;
    min-height: 1.2em;
    margin-bottom: 12px;
  }
  .card {
    background: rgba(255, 253, 247, 0.72);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(184, 148, 74, 0.35);
    border-radius: 16px;
    padding: 16px 18px;
    box-shadow: 0 4px 18px rgba(90, 70, 20, 0.08);
    margin-bottom: 14px;
  }
  label {
    display: block;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    color: #8a7c50;
    margin-bottom: 6px;
  }
  input[type="text"], textarea {
    width: 100%;
    border: 1px solid rgba(184, 148, 74, 0.4);
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 16px;
    font-family: inherit;
    background: rgba(255, 255, 255, 0.55);
    color: #2c2717;
  }
  input[type="text"]::placeholder, textarea::placeholder {
    color: #b3a67e;
  }
  input[type="text"]:focus, textarea:focus {
    outline: none;
    border-color: #b8860b;
    box-shadow: 0 0 0 3px rgba(184, 134, 11, 0.15);
  }
  textarea {
    resize: vertical;
    min-height: 64px;
  }
  button#sendBtn {
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #d8b968, #b8860b);
    color: #fffdf5;
    font-size: 0.95rem;
    font-weight: 500;
    letter-spacing: 0.15em;
    cursor: pointer;
    margin-top: 14px;
    box-shadow: 0 2px 10px rgba(184, 134, 11, 0.35);
    font-family: inherit;
  }
  button#sendBtn:hover {
    filter: brightness(1.08);
  }
  .reactions {
    display: flex;
    justify-content: space-around;
    gap: 10px;
  }
  .reaction-btn {
    flex: 1;
    padding: 12px 6px;
    border: 1px solid rgba(184, 148, 74, 0.35);
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.5);
    font-size: 1.15rem;
    cursor: pointer;
    text-align: center;
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
  }
  .reaction-btn:hover {
    border-color: #b8860b;
    box-shadow: 0 2px 10px rgba(184, 134, 11, 0.2);
  }
  .reaction-btn:active {
    transform: scale(0.96);
  }
  .reaction-btn .count {
    display: block;
    font-size: 0.75rem;
    color: #8a7c50;
    margin-top: 3px;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  }
  #messageList {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  #messageList li {
    background: rgba(255, 253, 247, 0.72);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(184, 148, 74, 0.3);
    border-radius: 12px;
    padding: 11px 14px;
    margin-bottom: 10px;
  }
  .msg-name {
    font-weight: 600;
    font-size: 0.85rem;
    color: #9c7a1a;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  }
  .msg-time {
    font-size: 0.68rem;
    color: #a89c78;
    float: right;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  }
  .msg-text {
    margin-top: 5px;
    font-size: 0.92rem;
    white-space: pre-wrap;
    word-break: break-word;
    color: #35301f;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    line-height: 1.6;
  }
  @keyframes floatUp {
    0% {
      transform: translateY(0) scale(1);
      opacity: 1;
    }
    100% {
      transform: translateY(-90px) scale(1.5);
      opacity: 0;
    }
  }
  .floating-emoji {
    position: fixed;
    pointer-events: none;
    font-size: 1.6rem;
    animation: floatUp 1s ease-out forwards;
    z-index: 999;
  }
</style>
</head>
<body>
<main>
  <h1>いまここボード</h1>
  <div class="subtitle">IMA KOKO BOARD</div>
  <div class="status" id="statusMsg"></div>

  <div class="card">
    <label for="nameInput">お名前（20文字まで）</label>
    <input type="text" id="nameInput" maxlength="20" placeholder="なまえ">
  </div>

  <div class="card">
    <label for="textInput">ひとこと（200文字まで）</label>
    <textarea id="textInput" maxlength="200" placeholder="いまここで思ったことを書いてね"></textarea>
    <button id="sendBtn">送信</button>
  </div>

  <div class="card reactions">
    <div class="reaction-btn" id="btnHeart">
      ❤️
      <span class="count" id="countHeart">0</span>
    </div>
    <div class="reaction-btn" id="btnClap">
      👏
      <span class="count" id="countClap">0</span>
    </div>
    <div class="reaction-btn" id="btnParty">
      🎉
      <span class="count" id="countParty">0</span>
    </div>
  </div>

  <ul id="messageList"></ul>
</main>

<script>
const SERVER = "https://imakoko-board-production.up.railway.app";

const statusMsg = document.getElementById("statusMsg");
const messageList = document.getElementById("messageList");

function escapeHtml(str) {
  return String(str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}

const displayedIds = new Set();

function createMessageElement(msg) {
  const li = document.createElement("li");
  li.innerHTML =
    '<span class="msg-time">' + escapeHtml(msg.created_at) + '</span>' +
    '<span class="msg-name">' + escapeHtml(msg.name) + '</span>' +
    '<div class="msg-text">' + escapeHtml(msg.text) + '</div>';
  return li;
}

async function loadMessages() {
  try {
    const res = await fetch(SERVER + "/api/messages");
    const data = await res.json();
    messageList.innerHTML = "";
    displayedIds.clear();
    for (const msg of data.messages) {
      messageList.appendChild(createMessageElement(msg));
      displayedIds.add(msg.id);
    }
    statusMsg.textContent = "";
  } catch (err) {
    statusMsg.textContent = "接続できません（URL確認）";
  }
}

async function pollMessages() {
  try {
    const res = await fetch(SERVER + "/api/messages");
    const data = await res.json();
    const newOnes = data.messages.filter((m) => !displayedIds.has(m.id));
    for (const msg of newOnes.reverse()) {
      messageList.prepend(createMessageElement(msg));
      displayedIds.add(msg.id);
    }
    statusMsg.textContent = "";
  } catch (err) {
    statusMsg.textContent = "接続できません（URL確認）";
  }
}

const nameInput = document.getElementById("nameInput");
const textInput = document.getElementById("textInput");
const sendBtn = document.getElementById("sendBtn");

async function sendMessage() {
  const name = nameInput.value.trim();
  const text = textInput.value.trim();
  if (!name || !text) {
    return;
  }
  try {
    await fetch(SERVER + "/api/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name, text: text })
    });
    textInput.value = "";
    statusMsg.textContent = "";
    await pollMessages();
  } catch (err) {
    statusMsg.textContent = "接続できません（URL確認）";
  }
}

sendBtn.addEventListener("click", sendMessage);

const btnHeart = document.getElementById("btnHeart");
const btnClap = document.getElementById("btnClap");
const btnParty = document.getElementById("btnParty");
const countHeart = document.getElementById("countHeart");
const countClap = document.getElementById("countClap");
const countParty = document.getElementById("countParty");

function updateReactionCounts(reactions) {
  countHeart.textContent = reactions.heart;
  countClap.textContent = reactions.clap;
  countParty.textContent = reactions.party;
}

async function loadReactions() {
  try {
    const res = await fetch(SERVER + "/api/reactions");
    const data = await res.json();
    updateReactionCounts(data);
    statusMsg.textContent = "";
  } catch (err) {
    statusMsg.textContent = "接続できません（URL確認）";
  }
}

function spawnFloatingEmoji(emoji, btnEl) {
  const rect = btnEl.getBoundingClientRect();
  const span = document.createElement("span");
  span.className = "floating-emoji";
  span.textContent = emoji;
  span.style.left = (rect.left + rect.width / 2 - 12) + "px";
  span.style.top = rect.top + "px";
  document.body.appendChild(span);
  setTimeout(() => span.remove(), 1000);
}

async function sendReaction(type, emoji, btnEl) {
  spawnFloatingEmoji(emoji, btnEl);
  try {
    const res = await fetch(SERVER + "/api/reactions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ type: type })
    });
    const data = await res.json();
    updateReactionCounts(data.reactions);
    statusMsg.textContent = "";
  } catch (err) {
    statusMsg.textContent = "接続できません（URL確認）";
  }
}

btnHeart.addEventListener("click", () => sendReaction("heart", "❤️", btnHeart));
btnClap.addEventListener("click", () => sendReaction("clap", "👏", btnClap));
btnParty.addEventListener("click", () => sendReaction("party", "🎉", btnParty));

loadMessages();
loadReactions();
setInterval(pollMessages, 1500);
setInterval(loadReactions, 1500);
</script>
</body>
</html>
