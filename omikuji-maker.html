<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>おみくじ診断メーカー</title>
<style>
  :root {
    color-scheme: light;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Hiragino Kaku Gothic ProN", "Yu Gothic", serif;
    background: #f5f0e1;
    color: #2c2717;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
    min-height: 100vh;
  }
  main {
    width: 100%;
    max-width: 460px;
  }
  h1 {
    text-align: center;
    font-size: 1.6rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    margin: 4px 0 2px;
    color: #2c2717;
  }
  .subtitle {
    text-align: center;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: #9c8b57;
    margin-bottom: 22px;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  }
  .status {
    text-align: center;
    font-size: 0.75rem;
    color: #a13d3d;
    min-height: 1.2em;
    margin-bottom: 12px;
  }
  .card {
    background: #fffdf7;
    border: 1px solid #e0d0a0;
    border-radius: 16px;
    padding: 20px 22px;
    box-shadow: 0 4px 16px rgba(90, 70, 20, 0.06);
    margin-bottom: 18px;
  }
  label {
    display: block;
    font-size: 0.72rem;
    letter-spacing: 0.05em;
    color: #8a7c50;
    margin-bottom: 5px;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  }
  input[type="text"] {
    width: 100%;
    border: 1px solid rgba(184, 148, 74, 0.4);
    border-radius: 8px;
    padding: 9px 11px;
    font-size: 16px;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: #fffefb;
    color: #2c2717;
    margin-bottom: 14px;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: #b8860b;
    box-shadow: 0 0 0 3px rgba(184, 134, 11, 0.15);
  }
  button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #d8b968, #b8860b);
    color: #fffdf5;
    font-size: 1rem;
    font-weight: 500;
    letter-spacing: 0.15em;
    cursor: pointer;
    box-shadow: 0 2px 10px rgba(184, 134, 11, 0.35);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  }
  button:hover {
    filter: brightness(1.08);
  }
  button:active {
    transform: scale(0.98);
  }
  #resultUrlBox {
    display: none;
  }
  #resultUrlBox input {
    margin-bottom: 0;
  }
  #playerView {
    display: none;
    text-align: center;
  }
  #drawResult {
    display: none;
    text-align: center;
    padding: 30px 20px;
  }
  #drawResult .result-text {
    font-size: 1.5rem;
    font-weight: 600;
    color: #9c7a1a;
    letter-spacing: 0.05em;
    line-height: 1.6;
  }
  #redrawBtn {
    margin-top: 18px;
    display: none;
  }
  @keyframes floatUp {
    0% {
      transform: translateY(0) scale(1);
      opacity: 1;
    }
    100% {
      transform: translateY(-100px) scale(1.6);
      opacity: 0;
    }
  }
  .floating-emoji {
    position: fixed;
    pointer-events: none;
    font-size: 1.8rem;
    animation: floatUp 1.1s ease-out forwards;
    z-index: 999;
  }
</style>
</head>
<body>
<main>
  <h1 id="pageTitle">おみくじ診断メーカー</h1>
  <div class="subtitle" id="pageSubtitle">OMIKUJI MAKER</div>
  <div class="status" id="statusMsg"></div>

  <div id="makerView">
    <div class="card">
      <label for="diagTitle">診断タイトル</label>
      <input type="text" id="diagTitle" maxlength="30" placeholder="例：今日の運勢おみくじ">

      <label for="res1">結果1</label>
      <input type="text" id="res1" maxlength="80" placeholder="例：大吉：今日はいいことがある予感！">
      <label for="res2">結果2</label>
      <input type="text" id="res2" maxlength="80" placeholder="結果2">
      <label for="res3">結果3</label>
      <input type="text" id="res3" maxlength="80" placeholder="結果3">
      <label for="res4">結果4</label>
      <input type="text" id="res4" maxlength="80" placeholder="結果4">
      <label for="res5">結果5</label>
      <input type="text" id="res5" maxlength="80" placeholder="結果5">
    </div>

    <button id="generateBtn">診断URLを作る</button>

    <div id="resultUrlBox" class="card">
      <label for="resultUrlInput">できあがったURL（コピーして配ってください）</label>
      <input type="text" id="resultUrlInput" readonly>
    </div>
  </div>

  <div id="playerView">
    <button id="drawBtn">おみくじを引く</button>
    <div id="drawResult" class="card">
      <div class="result-text" id="drawResultText"></div>
    </div>
    <button id="redrawBtn">もう一度引く</button>
  </div>
</main>

<script>
const statusMsg = document.getElementById("statusMsg");

function toBase64Unicode(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = "";
  bytes.forEach((b) => { binary += String.fromCharCode(b); });
  return btoa(binary);
}

function base64UrlEncode(str) {
  return toBase64Unicode(str)
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");
}

function base64UrlDecode(str) {
  let b64 = str.replace(/-/g, "+").replace(/_/g, "/");
  while (b64.length % 4) b64 += "=";
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/* ---- 作成モード ---- */
const generateBtn = document.getElementById("generateBtn");
const resultUrlBox = document.getElementById("resultUrlBox");
const resultUrlInput = document.getElementById("resultUrlInput");

function buildDiagnosisData() {
  const title = document.getElementById("diagTitle").value.trim();
  const results = [1, 2, 3, 4, 5].map(
    (n) => document.getElementById("res" + n).value.trim()
  );
  if (!title || !results.every((r) => r)) {
    return null;
  }
  return { t: title, r: results };
}

function generateUrl() {
  const data = buildDiagnosisData();
  if (!data) {
    statusMsg.textContent = "すべての項目を入力してください";
    resultUrlBox.style.display = "none";
    return;
  }
  statusMsg.textContent = "";
  const encoded = base64UrlEncode(JSON.stringify(data));
  const url = location.origin + location.pathname + "#d=" + encoded;
  resultUrlInput.value = url;
  resultUrlBox.style.display = "block";
}

generateBtn.addEventListener("click", generateUrl);

/* ---- プレイモード ---- */
const makerView = document.getElementById("makerView");
const playerView = document.getElementById("playerView");
const pageTitle = document.getElementById("pageTitle");
const pageSubtitle = document.getElementById("pageSubtitle");
const drawBtn = document.getElementById("drawBtn");
const drawResult = document.getElementById("drawResult");
const drawResultText = document.getElementById("drawResultText");
const redrawBtn = document.getElementById("redrawBtn");

const emojiList = ["✨", "🎉", "🍀", "⭐", "🌸"];

function spawnFloatingEmoji(emoji) {
  const span = document.createElement("span");
  span.className = "floating-emoji";
  span.textContent = emoji;
  span.style.left = (window.innerWidth / 2 - 16 + (Math.random() * 80 - 40)) + "px";
  span.style.top = (window.innerHeight / 2) + "px";
  document.body.appendChild(span);
  setTimeout(() => span.remove(), 1100);
}

function drawOmikuji(data) {
  drawBtn.style.display = "none";
  for (let i = 0; i < 6; i++) {
    setTimeout(() => {
      spawnFloatingEmoji(emojiList[Math.floor(Math.random() * emojiList.length)]);
    }, i * 80);
  }
  const picked = data.r[Math.floor(Math.random() * data.r.length)];
  setTimeout(() => {
    drawResultText.textContent = picked;
    drawResult.style.display = "block";
    redrawBtn.style.display = "block";
  }, 300);
}

function showPlayer(data) {
  makerView.style.display = "none";
  playerView.style.display = "block";
  pageTitle.textContent = data.t;
  pageSubtitle.textContent = "OMIKUJI";
  drawBtn.addEventListener("click", () => drawOmikuji(data));
  redrawBtn.addEventListener("click", () => {
    drawResult.style.display = "none";
    redrawBtn.style.display = "none";
    drawBtn.style.display = "block";
    drawOmikuji(data);
  });
}

function init() {
  const hash = location.hash;
  if (hash.startsWith("#d=")) {
    try {
      const data = JSON.parse(base64UrlDecode(hash.slice(3)));
      showPlayer(data);
      return;
    } catch (err) {
      statusMsg.textContent = "診断データの読み込みに失敗しました";
    }
  }
}

init();
</script>
</body>
</html>
